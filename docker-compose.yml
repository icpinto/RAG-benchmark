services:
  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      - postgres
      - redis
      - qdrant
      - opensearch
    command: uvicorn services.api.app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    env_file: .env
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      - postgres
      - redis
      - qdrant
      - opensearch
      - ollama
    command: celery -A services.worker.app.celery_app worker --loglevel=INFO --concurrency=1

  ui:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    env_file: .env
    ports:
      - "8501:8501"
    volumes:
      - ./configs:/app/configs
      - ./data:/app/data
      - ./artifacts:/app/artifacts
    depends_on:
      - api
    command: streamlit run services/ui/app.py --server.address=0.0.0.0 --server.port=8501

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ragbench
      POSTGRES_USER: ragbench
      POSTGRES_PASSWORD: ragbench
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: admin
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  postgres_data:
  qdrant_data:
  opensearch_data:
  minio_data:
  ollama_data:
