experiment:
  name: "v1_rag_benchmark"
  description: "Runnable MVP benchmark over ingestion and query variants"

runtime:
  retrieval_cache:
    enabled: true
    backend: file

data:
  input_dir: "/app/data/raw"
  remote_urls_file: "/app/data/raw/urls.txt"
  ground_truth_file: "/app/data/eval/qa.json"

pipeline:
  ingestion:
    # Prefer docling over pdf when table, image, and layout understanding matters.
    # Keeping pdf disabled here avoids duplicate PDF ingestion in the default rich-extraction path.
    extractors: ["txt", "markdown", "docling", "html_url"]
    extractor_configs:
      docling:
        ocr: true
        table_structure: true
        image_descriptions: true
    cleaners:
      - type: "basic"
    chunkers:
      - type: "fixed"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "recursive"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_fixed"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_sentence"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_hierarchical"
        chunk_size: [256, 512]
        parent_chunk_size: [1024]
        overlap: [0, 0.2]
      - type: "llamaindex_semantic"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_structure"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
    metadata_enrichers:
      - type: "basic"
    embeddings:
      - provider: "sentence_transformers"
        model: "sentence-transformers/all-MiniLM-L6-v2"
      - provider: "sentence_transformers"
        model: "BAAI/bge-small-en-v1.5"
      # E5 models are also supported. Use the short aliases below or the full
      # Hugging Face IDs (for example, "intfloat/e5-large-v2").
      # - provider: "sentence_transformers"
      #   model: "e5-base-v2"
      #   batch_size: 32
      #   normalize: true
      #   query_prefix: "query: "
      #   document_prefix: "passage: "
      # - provider: "sentence_transformers"
      #   model: "e5-large-v2"
      # Hosted embedders support api_key (or provider env vars), base_url, model,
      # batch_size, normalize, query_prefix, and document_prefix.
      # - provider: "openai"
      #   api_key: "${OPENAI_API_KEY}"
      #   base_url: "https://api.openai.com/v1"
      #   model: "text-embedding-3-small"
      #   batch_size: 64
      #   normalize: false
      # - provider: "voyage"
      #   api_key: "${VOYAGE_API_KEY}"
      #   model: "voyage-3"
      # - provider: "cohere"
      #   api_key: "${COHERE_API_KEY}"
      #   model: "embed-v4.0"
      # - provider: "jina"
      #   api_key: "${JINA_API_KEY}"
      #   model: "jina-embeddings-v3"
      # - provider: "bge_m3"
      #   model: "BAAI/bge-m3"
      #   batch_size: 32
      #   normalize: true
      # Neural sparse embedders populate Chunk.sparse_embedding for SPLADE or
      # BGE-M3 lexical retrieval. Use bge_m3_hybrid when the same run should
      # produce both dense vectors for Qdrant and sparse vectors for neural_sparse.
      # - provider: "bge_m3_sparse"
      #   model: "BAAI/bge-m3"
      #   batch_size: 16
      #   sparse_top_k: 256
      # - provider: "splade_sparse"
      #   model: "naver/splade-cocondenser-ensembledistil"
      #   batch_size: 8
      #   max_length: 512
      #   sparse_top_k: 256
      # - provider: "bge_m3_hybrid"
      #   model: "BAAI/bge-m3"
      #   batch_size: 16
      #   normalize: true
      #   sparse_top_k: 256
    indexers:
      dense:
        type: "qdrant"
        strategies:
          - "dense_hnsw"
          - "dense_hnsw_tuned"
          - "dense_exact"
          - "dense_quantized"
          - "dense_on_disk"
          - "dense_payload_indexed"
        # To sweep custom Qdrant dense settings, replace the strategies list
        # above with the example below. List-valued settings are expanded into
        # benchmark cases via Cartesian product, and the chosen values are
        # persisted in case metadata and result artifacts.
        # strategy: "dense_hnsw_custom"
        # hnsw_m: [16, 32, 64]
        # ef_construct: [100, 200]
        # search_ef: [64, 128, 256]
        # quantization_config:
        #   type: "int8"
        #   quantile: [0.95, 0.99]
        #   always_ram: [true, false]
        # on_disk: [true, false]
        # on_disk_payload: [true, false]
        # hnsw_on_disk: [true, false]
      sparse:
        type: "opensearch"
        strategies:
          - "bm25_standard"
          - "bm25_field_weighted"
          - "bm25_custom_analyzer"
          - "bm25_phrase"
      # Neural sparse indexer examples. Uncomment one of these and pair it with
      # bge_m3_sparse, splade_sparse, or bge_m3_hybrid above. OpenSearch stores
      # token weights in rank_features; Qdrant stores them in a separate sparse
      # vector collection named <index_name>_neural_sparse by default.
      # sparse:
      #   type: "opensearch_neural_sparse"
      #   strategy: "neural_sparse_rank_features"
      #   field: "sparse_embedding"
      # sparse:
      #   type: "qdrant_sparse"
      #   vector_name: "neural_sparse"
      #   on_disk: false

  query:
    rewriters:
      - type: "none"
      - type: "hyde"
    retrievers:
      - type: "dense"
      - type: "dense_filtered"
        # Filters are applied inside Qdrant before vector ranking. Keys without
        # a prefix are matched against the chunk metadata payload; doc_id and
        # chunk_id target top-level payload fields. Example:
        # metadata_filters:
        #   source: "refund_windows.md"
        #   word_count: {gte: 20}
        metadata_filters: {}
      - type: "parent_document"
        # Retrieves hierarchical child chunks from Qdrant, dedupes by parent_chunk_id,
        # and returns the stored parent_text as context. Use dense_filtered here
        # when metadata filters should be pushed down to child retrieval.
        base_retriever: "dense"
        child_top_k_multiplier: 4
      - type: "bm25"
      - type: "hybrid"
        # Defaults to dense + BM25. To fetch dense + neural sparse from
        # bge_m3_hybrid query embeddings, set sources: ["dense", "neural_sparse"]
        # and configure the nested neural_sparse backend below.
        sources: ["dense", "bm25"]
        # neural_sparse:
        #   backend: "opensearch"
        #   field: "sparse_embedding"
      # Neural sparse retrieval expects a sparse query embedding from
      # bge_m3_sparse, splade_sparse, or the sparse side of bge_m3_hybrid.
      # - type: "neural_sparse"
      #   backend: "opensearch"
      #   field: "sparse_embedding"
      #   query_terms: 256
      # - type: "neural_sparse"
      #   backend: "qdrant"
      #   vector_name: "neural_sparse"
      # Weighted hybrid fuses available dense, BM25, and neural sparse result
      # sets with weighted reciprocal-rank fusion. Use bge_m3_hybrid to provide
      # both dense and sparse query vectors in one embedder configuration.
      # - type: "weighted_hybrid"
      #   weights:
      #     dense: 1.0
      #     bm25: 1.0
      #     neural_sparse: 1.0
      #   rrf_k: 60
      #   neural_sparse:
      #     backend: "opensearch"
      #     field: "sparse_embedding"
      #     query_terms: 256
      - type: "multi_query_fusion"
        # Runs the configured base retriever for each rewritten query (for
        # example, the original question plus HyDE's hypothetical passage)
        # and fuses those per-query rankings with reciprocal rank fusion.
        # Supported base retrievers include dense, dense_filtered, bm25,
        # hybrid, neural_sparse, and weighted_hybrid.
        base_retriever: "dense"
        fusion: "rrf"
      - type: "adaptive_hybrid"
        # Query-length adaptive routing: short queries use BM25, long
        # descriptive queries use hybrid RRF, and medium-length queries
        # use dense retrieval by default. Thresholds are token counts.
        # neural_sparse and weighted_hybrid can also be used when paired with
        # a sparse-capable embedder/indexer configuration.
        short_query_mode: "bm25"
        long_query_mode: "hybrid"
        default_mode: "dense"
        short_query_max_terms: 4
        long_query_min_terms: 12
    filters:
      - type: "none"
    rerankers:
      - type: "none"
      - type: "cross_encoder"
        model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      - type: "flashrank"
        # FlashRank runs small ONNX rerankers efficiently on CPU.
        # model defaults to FlashRank's default when omitted.
        model: "ms-marco-TinyBERT-L-2-v2"
        max_length: 512
      - type: "rankllm"
        # RankLLM supports listwise LLM reranking. Use API-backed models with
        # api_key, or local RankLLM-compatible models if dependencies are installed.
        model: "rankllm"
        # api_key: "${OPENAI_API_KEY:}"
      # ColBERT requires the rerankers transformers extra, which conflicts with
      # FlagEmbedding's pinned transformers version in the base Docker image.
      # Install compatible optional dependencies separately before enabling.
      # - type: "colbert"
      #   model: "colbert"
      # Hosted rerankers are available when API keys are configured. Uncomment
      # the Cohere block and set api_key here, or set COHERE_API_KEY in the
      # environment. top_n defaults to the number of retrieved results.
      # - type: "cohere"
      #   model: "rerank-v3.5"
      #   api_key: "${COHERE_API_KEY:}"
      # Jina reranking runs the open-source model locally via SentenceTransformers
      # and does not require JINA_API_KEY. Uncomment to include it in the grid.
      # - type: "jina"
      #   model: "jinaai/jina-reranker-v2-base-multilingual"
      #   trust_remote_code: true
      - type: "diversity_mmr"
        # Maximum Marginal Relevance balances original retrieval relevance
        # against chunk-to-chunk similarity. 1.0 is relevance-only; 0.0 is
        # diversity-only. Uses chunk embeddings when present and falls back to
        # token cosine similarity over chunk text.
        lambda_mult: 0.5
    compressors:
      - type: "none"
      - type: "top_n"
        max_chunks: 5
    context_assemblers:
      - type: "default"
        max_context_chars: 12000
    prompt_builders:
      - type: "default"
    citation_validators:
      - type: "simple"

llm:
  provider: "ollama"
  model: "${OLLAMA_MODEL:gpt-oss:20b}"
  base_url: "${OLLAMA_BASE_URL:http://ollama:11434}"
  temperature: 0.0

metrics:
  retrieval_k: [3, 5, 10]
  enabled:
    - recall_at_k
    - precision_at_k
    - mrr
    - ndcg
    - latency
    - index_size
    - citation_coverage
    - answer_correctness_placeholder
    - faithfulness_placeholder

runtime:
  max_combinations: 32
  collection_prefix: "ragbench"
  artifact_dir: "/app/artifacts"
  embedding_cache:
    enabled: true
    backend: file
