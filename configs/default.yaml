experiment:
  name: "v1_rag_benchmark"
  description: "Runnable MVP benchmark over ingestion and query variants"

data:
  input_dir: "/app/data/raw"
  remote_urls_file: "/app/data/raw/urls.txt"
  ground_truth_file: "/app/data/eval/qa.json"

pipeline:
  ingestion:
    extractors: ["txt", "markdown", "pdf", "html_url"]
    cleaners:
      - type: "basic"
    chunkers:
      - type: "fixed"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "recursive"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_fixed"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_sentence"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_hierarchical"
        chunk_size: [256, 512]
        parent_chunk_size: [1024]
        overlap: [0, 0.2]
      - type: "llamaindex_semantic"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
      - type: "llamaindex_structure"
        chunk_size: [256, 512]
        overlap: [0, 0.2]
    metadata_enrichers:
      - type: "basic"
    embeddings:
      - provider: "sentence_transformers"
        model: "sentence-transformers/all-MiniLM-L6-v2"
      - provider: "sentence_transformers"
        model: "BAAI/bge-small-en-v1.5"
      # E5 models are also supported. Use the short aliases below or the full
      # Hugging Face IDs (for example, "intfloat/e5-large-v2").
      # - provider: "sentence_transformers"
      #   model: "e5-base-v2"
      # - provider: "sentence_transformers"
      #   model: "e5-large-v2"
    indexers:
      dense:
        type: "qdrant"
      sparse:
        type: "opensearch"

  query:
    rewriters:
      - type: "none"
      - type: "hyde"
    retrievers:
      - type: "dense"
      - type: "bm25"
      - type: "hybrid"
    filters:
      - type: "none"
    rerankers:
      - type: "none"
      - type: "cross_encoder"
        model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
    compressors:
      - type: "none"
      - type: "top_n"
        max_chunks: 5
    context_assemblers:
      - type: "default"
        max_context_chars: 12000
    prompt_builders:
      - type: "default"
    citation_validators:
      - type: "simple"

llm:
  provider: "ollama"
  model: "${OLLAMA_MODEL:gpt-oss:20b}"
  base_url: "${OLLAMA_BASE_URL:http://ollama:11434}"
  temperature: 0.0

metrics:
  retrieval_k: [3, 5, 10]
  enabled:
    - recall_at_k
    - precision_at_k
    - mrr
    - ndcg
    - latency
    - index_size
    - citation_coverage
    - answer_correctness_placeholder
    - faithfulness_placeholder

runtime:
  max_combinations: 32
  collection_prefix: "ragbench"
  artifact_dir: "/app/artifacts"
