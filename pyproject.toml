[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-benchmark-platform"
version = "0.1.0"
description = "Advanced modular RAG benchmarking platform"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "RAG Benchmark Platform contributors" },
]
maintainers = [
  { name = "RAG Benchmark Platform contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "celery==5.4.0",
  "redis==5.2.1",
  "SQLAlchemy==2.0.36",
  "psycopg2-binary==2.9.10",
  "pydantic==2.10.3",
  "pydantic-settings==2.7.0",
  "python-multipart==0.0.19",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "beautifulsoup4==4.12.3",
  "markdown-it-py==3.0.0",
  "pypdf==5.1.0",
  "qdrant-client==1.12.1",
  "opensearch-py==2.8.0",
  "sentence-transformers==3.3.1",
  "FlagEmbedding==1.3.3",
  "rank-bm25==0.2.2",
  "numpy==2.1.3",
  "scikit-learn==1.5.2",
  "tiktoken==0.8.0",
  "llama-index-core==0.12.11",
  "pandas==2.2.3",
  "streamlit==1.41.1",
  "httpx==0.28.1",
  "minio==7.2.12",
  "flashrank==0.2.10",
  "rerankers[rankllm]==0.10.0",
]

[project.urls]
Homepage = "https://github.com/rag-benchmark-platform/rag-benchmark-platform"
Repository = "https://github.com/rag-benchmark-platform/rag-benchmark-platform"
Issues = "https://github.com/rag-benchmark-platform/rag-benchmark-platform/issues"
Documentation = "https://github.com/rag-benchmark-platform/rag-benchmark-platform#readme"

[project.optional-dependencies]
local-embeddings = [
  "sentence-transformers==3.3.1",
  "FlagEmbedding==1.3.3",
]
rerankers = [
  "flashrank==0.2.10",
  "rerankers[rankllm]==0.10.0",
  "rank-bm25==0.2.2",
]
opensearch = [
  "opensearch-py==2.8.0",
]
qdrant = [
  "qdrant-client==1.12.1",
]
ui = [
  "streamlit==1.41.1",
]
dev = [
  "pytest>=8.0",
]
test = [
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = { "" = "packages" }

[tool.setuptools.packages.find]
where = ["packages"]

[tool.pytest.ini_options]
pythonpath = ["packages", "."]
testpaths = ["tests"]
